[project]
name = "jihai"
version = "1.1.0"
description = "JiHai. November 4, 1995. Scorpio. The pig on the year and the day."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Christian Rivera" }]

[project.scripts]
jihai = "jihai.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jihai*"]
